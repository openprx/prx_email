[package]
name = "prx_email"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SQLite-only M1 foundation for PRX Email"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
