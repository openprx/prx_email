[package]
name = "prx_email"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SQLite-only M1 foundation for PRX Email"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
imap = { version = "2.4", default-features = false }
rustls = "0.23"
rustls-connector = "0.20"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname", "pool"] }
mail-parser = "0.10"
base64 = "0.22"
mime = "0.3"
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3.10"
