[package]
name = "prx_email"
version = "0.1.0"
edition = "2024"
authors = ["g1e2x87"]
license = "MIT OR Apache-2.0"
description = "Self-hosted email client with IMAP/SMTP and OAuth support"
repository = "https://github.com/openprx/prx_email"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
imap = { version = "2.4", default-features = false }
rustls = "0.23"
rustls-connector = "0.20"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname", "pool"] }
mail-parser = "0.10"
base64 = "0.22"
mime = "0.3"
webpki-roots = "0.26"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
